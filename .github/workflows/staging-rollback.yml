      - name: Simulate failed deployment
        id: simulate_failure
        continue-on-error: true
        run: |
          echo "Simulating a failed deployment..."

          kubectl set image deployment/staging-app \
            staging-app=staging-app:bad-version \
            -n staging

          kubectl rollout status deployment/staging-app \
            -n staging \
            --timeout=30s

      - name: Rollback failed deployment
        if: steps.simulate_failure.outcome == 'failure'
        run: |
          echo "Failed deployment detected."
          echo "Starting automatic rollback..."

          kubectl rollout undo deployment/staging-app -n staging

          kubectl rollout status deployment/staging-app \
            -n staging \
            --timeout=120s

          echo "Rollback completed successfully."